<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" role="img" aria-labelledby="title desc">
  <title id="title">Casio fx-991CW scientific calculator</title>
  <desc id="desc">A dark scientific calculator shown at an isometric angle with a clear display and visible keypad.</desc>
